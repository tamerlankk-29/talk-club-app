name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: talkclub
          POSTGRES_PASSWORD: talkclub
          POSTGRES_DB: talkclub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talkclub -d talkclub_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://talkclub:talkclub@localhost:5432/talkclub_test?schema=public
      TEST_DATABASE_URL: postgresql://talkclub:talkclub@localhost:5432/talkclub_test?schema=public
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec --workspace apps/api -- prisma generate
      - name: Type-check
        run: npm run lint
      - name: Tests (unit + integration)
        run: npm test
      - name: Production build
        run: npm run build
