# Talk Club — full stack in containers (PostgreSQL 17, API, web).
#
#   cp .env.compose.example .env      # then set AUTH_SECRET and VAPID keys
#   docker compose up -d --build
#   docker compose --profile demo run --rm seed   # optional: demo data (never in production)
#
# On the production server COMPOSE_PROFILES=production in .env also starts Caddy (HTTPS on
# ports 80/443) and the nightly backup service. First-time setup: scripts/server-setup.sh.
#
# Web: http://localhost:3000 (bound to 127.0.0.1; the TLS reverse proxy on the host serves it publicly)
# For a public deployment put a TLS reverse proxy in front of "web" (see docs/DEPLOYMENT.md).

name: talkclub

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talkclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talkclub}
      POSTGRES_DB: ${POSTGRES_DB:-talkclub}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    # Not published by default: only the API reaches the database over the compose network.
    # For local access uncomment and keep it bound to 127.0.0.1.
    # ports:
    #   - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talkclub} -d ${POSTGRES_DB:-talkclub}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talkclub}:${POSTGRES_PASSWORD:-talkclub}@db:5432/${POSTGRES_DB:-talkclub}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-talkclub}:${POSTGRES_PASSWORD:-talkclub}@db:5432/${POSTGRES_DB:-talkclub}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (at least 32 random characters)}
      AUTH_OTP_DEV_ECHO: ${AUTH_OTP_DEV_ECHO:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AUTH_SMS_DAILY_LIMIT: ${AUTH_SMS_DAILY_LIMIT:-200}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-mailto:hello@talkclub.kz}
      NOTIFY_EMAIL_PROVIDER: ${NOTIFY_EMAIL_PROVIDER:-console}
      NOTIFY_SMS_PROVIDER: ${NOTIFY_SMS_PROVIDER:-}
      MOBIZON_API_KEY: ${MOBIZON_API_KEY:-}
      MOBIZON_FROM: ${MOBIZON_FROM:-}
      NOTIFY_WHATSAPP_PROVIDER: ${NOTIFY_WHATSAPP_PROVIDER:-console}
      NOTIFY_TELEGRAM_PROVIDER: ${NOTIFY_TELEGRAM_PROVIDER:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      PAYMENT_MOCK_ONLINE_ENABLED: ${PAYMENT_MOCK_ONLINE_ENABLED:-false}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      KASPI_MERCHANT_ID: ${KASPI_MERCHANT_ID:-}
      KASPI_API_KEY: ${KASPI_API_KEY:-}
      JOBS_ENABLED: "true"
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-}
    volumes:
      - uploads:/app/apps/api/uploads
    # Not published by default: the browser reaches the API through the web app's /api proxy.
    # ports:
    #   - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # HTTPS reverse proxy (production profile): Let's Encrypt certificates for APP_DOMAIN.
  caddy:
    image: caddy:2.10-alpine
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      # Caddy refuses to start with an empty e-mail, so fall back to the club address.
      ACME_EMAIL: ${ACME_EMAIL:-hello@talkclub.kz}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Nightly database and uploads backups (production profile), kept 30 days in ./backups,
  # with a monthly restore test and Telegram alerts. See deploy/backup.sh.
  backup:
    image: postgres:17-alpine
    profiles: ["production"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      TZ: Asia/Almaty
      POSTGRES_USER: ${POSTGRES_USER:-talkclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talkclub}
      POSTGRES_DB: ${POSTGRES_DB:-talkclub}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
      - uploads:/uploads:ro
    depends_on:
      db:
        condition: service_healthy

  # Demo data for a local or staging trial run — refuses to run with NODE_ENV=production.
  seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-talkclub}:${POSTGRES_PASSWORD:-talkclub}@db:5432/${POSTGRES_DB:-talkclub}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-demo-only-secret-demo-only-secret-0000}
    command: ["npx", "ts-node", "--transpile-only", "prisma/seed.ts", "--reset"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
